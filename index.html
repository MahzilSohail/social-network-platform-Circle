<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle — Social Network</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark"></div><span class="brand-text">Circle</span></div>

  <div class="topbar-search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Search posts or people…">
  </div>

  <div class="topbar-right">
    <button class="bell-btn" id="theme-toggle-btn" title="Toggle light / dark mode"></button>

    <div class="live-pill" title="Real-time layer connected (BroadcastChannel)">
      <span class="live-dot"></span><span class="live-text">Live</span>
    </div>

    <div class="topbar-auth-btns" id="topbar-auth-btns" style="display:none;">
      <button type="button" class="topbar-btn-login" id="topbar-login-btn">Log In</button>
      <button type="button" class="topbar-btn-signup" id="topbar-signup-btn">Sign Up</button>
    </div>

    <div class="bell-wrap user-menu-wrap" id="user-menu-wrap" style="display:none;">
      <button class="user-menu-btn" id="user-menu-btn" title="Account Menu">
        <div class="mini-avatar" id="viewer-avatar"></div>
        <span class="user-menu-name" id="user-menu-name"></span>
        <svg class="chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <div class="dropdown user-dropdown" id="user-dropdown">
        <div class="user-dropdown-header">
          <div class="avatar" id="user-menu-big-avatar"></div>
          <div class="user-dropdown-info">
            <div class="user-dropdown-name" id="user-menu-full-name"></div>
            <div class="user-dropdown-handle" id="user-menu-handle"></div>
            <div class="user-dropdown-status"><span class="presence-dot online"></span> Active now</div>
          </div>
        </div>

        <div class="user-dropdown-menu">
          <button class="user-dropdown-item" id="menu-view-profile">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span>View My Profile</span>
          </button>
          <button class="user-dropdown-item" id="menu-edit-bio">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Edit Bio & Privacy</span>
          </button>
          <button class="user-dropdown-item" id="menu-saved-posts">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            <span>Saved Posts</span>
          </button>
          <button class="user-dropdown-item" id="menu-theme-toggle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span>Switch Theme</span>
          </button>
          <div class="user-dropdown-divider"></div>
          <button class="user-dropdown-item logout-item" id="menu-logout-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Log Out</span>
          </button>
        </div>
      </div>
    </div>

    <div class="bell-wrap">
      <button class="bell-btn" id="msg-btn" title="Messages">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span class="badge" id="msg-badge" style="display:none;">0</span>
      </button>
      <div class="dropdown" id="msg-dropdown">
        <div class="dropdown-head"><h4>Messages</h4></div>
        <div class="dropdown-body" id="msg-list"></div>
      </div>
    </div>

    <div class="bell-wrap">
      <button class="bell-btn" id="bell-btn" title="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="badge" id="notif-badge" style="display:none;">0</span>
      </button>
      <div class="dropdown" id="notif-dropdown">
        <div class="dropdown-head"><h4>Notifications</h4><button id="mark-all-read">Mark all read</button></div>
        <div class="dropdown-body" id="notif-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="col col-left" id="col-left">

    <div class="panel" id="profile-card">
      <div class="profile-cover" id="profile-cover"></div>
      <div class="profile-card-body">
        <div class="avatar" id="profile-avatar"></div>
        <div class="profile-name" id="profile-name"></div>
        <div class="profile-handle" id="profile-handle"></div>
        <div class="profile-bio" id="profile-bio"></div>
        <button class="edit-bio-btn" id="edit-bio-btn">Edit bio</button>
        <div class="profile-stats">
          <div><b id="stat-friends">0</b> friends</div>
          <div><b id="stat-posts">0</b> posts</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Privacy settings</h3>
      <div class="field">
        <label for="profile-visibility">Who can view my profile</label>
        <select id="profile-visibility">
          <option value="public">Public — anyone</option>
          <option value="friends">Friends only</option>
          <option value="onlyme">Only me</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="default-post-visibility">Default audience for new posts</label>
        <select id="default-post-visibility">
          <option value="public">Public</option>
          <option value="friends">Friends only</option>
          <option value="onlyme">Only me</option>
        </select>
      </div>
      <div class="hint">Post audience can still be changed per-post from the composer below.</div>
    </div>
  </div>

  <div class="col col-center mobile-show" id="col-center">
    <div class="panel">
      <div class="composer">
        <div class="avatar" id="composer-avatar"></div>
        <div class="composer-main">
          <textarea id="composer-text" placeholder="Share something with your circle…" rows="2"></textarea>
          <div class="composer-image-preview" id="composer-preview">
            <img id="composer-preview-img" src="" alt="">
            <button id="composer-remove-image" title="Remove image">&times;</button>
          </div>
          <div class="composer-row">
            <label class="icon-btn" title="Add photo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
              <input type="file" accept="image/*" id="composer-file" style="display:none;">
            </label>
            <select class="vis-select" id="composer-visibility">
              <option value="public">Public</option>
              <option value="friends">Friends</option>
              <option value="onlyme">Only me</option>
            </select>
            <button class="btn-primary" id="composer-post-btn">Post</button>
          </div>
        </div>
      </div>
    </div>

    <div class="feed-filter-row">
      <button class="chip feed-chip active" data-feed-filter="all">All posts</button>
      <button class="chip feed-chip" data-feed-filter="saved">Saved</button>
    </div>

    <div id="feed"></div>
  </div>

  <div class="col col-right" id="col-right">
    <div class="panel">
      <h3>Friend requests</h3>
      <div id="incoming-requests"></div>
    </div>
    <div class="panel">
      <h3>People you may know</h3>
      <div id="suggestions"></div>
    </div>
    <div class="panel">
      <h3>Your friends</h3>
      <div id="friends-list"></div>
    </div>
  </div>
</div>

<div class="mobile-tabs">
  <button data-tab="feed" class="active">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Feed
  </button>
  <button data-tab="right">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    Friends
  </button>
  <button data-tab="left">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profile
  </button>
</div>

<div class="toast-stack" id="toast-stack"></div>

<div class="modal-overlay" id="profile-modal-overlay">
  <div class="modal" id="profile-modal-content"></div>
</div>

<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close-btn">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="modal-overlay" id="chat-modal-overlay">
  <div class="modal chat-modal" id="chat-modal-content"></div>
</div>

<!-- ================= AUTH OVERLAY (LOG IN & SIGN UP) ================= -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark"></div>
      <span class="brand-text">Circle</span>
    </div>
    <div class="auth-subtitle">A mindful space for real connections</div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login-btn">Log In</button>
      <button type="button" class="auth-tab" id="tab-signup-btn">Create Account</button>
    </div>

    <!-- Log In Panel -->
    <div class="auth-panel active" id="login-panel">
      <form id="login-form" autocomplete="on">
        <div class="auth-field">
          <label for="login-identifier">Email or @handle</label>
          <input type="text" id="login-identifier" placeholder="e.g. mahzil@example.com or @mahzilsohail" required>
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pwd-btn" data-target="login-password" title="Show password">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-error" id="login-error" style="display:none;"></div>
        <button type="submit" class="auth-submit-btn">Log In to Circle</button>
      </form>

      <div class="auth-demo-section">
        <div class="auth-demo-title">Quick Demo Login (1-click test):</div>
        <div class="auth-demo-chips" id="demo-chips-list"></div>
      </div>
    </div>

    <!-- Sign Up Panel -->
    <div class="auth-panel" id="signup-panel">
      <form id="signup-form" autocomplete="on">
        <div class="auth-field">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="e.g. Ayesha Khan" required>
        </div>
        <div class="auth-field">
          <label for="signup-handle">Username / Handle</label>
          <input type="text" id="signup-handle" placeholder="e.g. @ayesha.k" required>
        </div>
        <div class="auth-field">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="e.g. ayesha@example.com" required>
        </div>
        <div class="auth-field">
          <label for="signup-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="signup-password" placeholder="Create a password (min 6 chars)" required minlength="6">
            <button type="button" class="toggle-pwd-btn" data-target="signup-password" title="Show password">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-field">
          <label for="signup-bio">Bio (optional)</label>
          <input type="text" id="signup-bio" placeholder="Tell your circle about you…">
        </div>
        <div class="auth-field">
          <label>Avatar Color</label>
          <div class="auth-color-picker" id="signup-color-picker">
            <button type="button" class="color-dot active" data-color="#1F6F54" style="background:#1F6F54" title="Forest Green"></button>
            <button type="button" class="color-dot" data-color="#C98A2C" style="background:#C98A2C" title="Amber Gold"></button>
            <button type="button" class="color-dot" data-color="#C0546B" style="background:#C0546B" title="Rose Pink"></button>
            <button type="button" class="color-dot" data-color="#55647A" style="background:#55647A" title="Slate Blue"></button>
            <button type="button" class="color-dot" data-color="#B06A45" style="background:#B06A45" title="Warm Clay"></button>
          </div>
        </div>
        <div class="auth-error" id="signup-error" style="display:none;"></div>
        <button type="submit" class="auth-submit-btn">Create Account & Join</button>
      </form>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
